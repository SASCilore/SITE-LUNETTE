<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Certains navigateurs Android (Samsung Internet, Chrome avec "Thème sombre pour les sites")
         appliquent d'office un assombrissement automatique à tout site qui ne déclare pas gérer
         lui-même le mode sombre — même si le site est déjà en thème clair. C'est ce qui rendait le
         site "sombre" sur Samsung alors qu'il restait clair sur iPhone (Safari n'a pas cette
         fonctionnalité). Cette balise indique au navigateur que le site gère lui-même ses deux
         thèmes, ce qui désactive cet assombrissement forcé. -->
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Lunettes de marque pas cher | Livraison 24h – go2glass</title>
    <meta name="description" content="Ray-Ban, Oakley, Prada, Gucci et plus : lunettes de marque authentiques à prix imbattables, livrées en 24h partout en France. Garantie du meilleur prix." />
    <!-- Open Graph / Twitter Card — sans ça, un lien go2glass partagé sur WhatsApp, Facebook ou
         Instagram n'affichait ni titre ni image, juste une URL nue. Ces valeurs par défaut sont
         remplacées dynamiquement page par page (voir l'effet "SEO" de Root et de ProductModal dans
         App.jsx), en particulier avec la vraie photo du produit sur une fiche produit.
         ⚠️ og:url pointe vers l'adresse Vercel actuelle (pas encore de domaine go2glass.fr connecté)
         — à mettre à jour ici une fois le nom de domaine définitif branché sur Vercel. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="go2glass" />
    <meta property="og:title" content="Lunettes de marque pas cher | Livraison 24h – go2glass" />
    <meta property="og:description" content="Ray-Ban, Oakley, Prada, Gucci et plus : lunettes de marque authentiques à prix imbattables, livrées en 24h partout en France." />
    <meta property="og:url" content="https://site-lunette.vercel.app/" />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "go2glass",
        "description": "Boutique en ligne de lunettes de marque authentiques (solaire et vue) à prix imbattables, livrées en 24h en France."
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Archivo:wght@800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
